[project]
name = "aster-cybergym"
version = "0.1.0"
description = "Aster-based agent runner for the CyberGym benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aster[tracing]",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
runner = [
    "cybergym[server] @ git+https://github.com/sunblaze-ucb/cybergym.git@c6fe2027d39471375920b92cf1025e23a99ffda5",
    "docker>=7.1.0",
]

[project.scripts]
aster-cybergym-run = "aster_cybergym.run:main"
aster-cybergym-agent = "aster_cybergym.main:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aster_cybergym"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
aster = { path = "../..", editable = true }

[tool.uv]
# Ignore packages uploaded less than 7 days ago to mitigate supply-chain attacks
exclude-newer = "2026-10-21T00:00:00Z"
# Match the current checkout's LiteLLM and tracing constraints.
constraint-dependencies = [
    "litellm==1.97.0",
    "openinference-instrumentation==0.1.54",
    "openinference-instrumentation-litellm==0.1.34",
]
