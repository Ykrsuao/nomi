# Minimal Harbor configuration for the ASTER bench agent.
# Run from the repo root:
#   PYTHONPATH=examples/benchmarks harbor run --config examples/benchmarks/harbor_minimal.yaml
jobs_dir: /tmp/harbor_jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: apptainer
  kwargs:
    apptainer_binary: apptainer
agents:
  - import_path: harbor_adapter:AsterBenchAgent
    # NVIDIA inference gateway (OpenAI-compatible); needs NVIDIA_INFERENCE_API_KEY.
    model_name: openai/nvidia/nvidia/nemotron-3-ultra-preview
    kwargs:
      # Set ASTER_GIT_URL to your Aster source repository's clone URL.
      # Alternatively, supply that URL as git_url here.
      api_base: https://inference-api.nvidia.com/v1
      enable_atif: false
      # Set ASTER_GIT_REF for an optional branch/tag/SHA.
      # agent_type: bench      # registry key in packages/aster-bench
datasets:
  - path: /path/to/your/tasks/
