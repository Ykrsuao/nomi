name: CI

on:
  push:
    branches: [main, microsandbox-platform-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_native:
        description: Run experimental native macOS tests (not currently supported)
        type: boolean
        default: false
      macos_sandbox:
        description: Run experimental microVM tests on a self-hosted Apple Silicon Mac
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-extras --no-extra sandbox
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: SPDX license headers
        run: uv run python scripts/check_license_headers.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-extras --no-extra sandbox
      # tests/tools/test_shell_tools_modern.py skipif-drops 145 tests when `rg`
      # is not on PATH. ubuntu-latest does not ship ripgrep, so without this
      # step those tests silently skip and the job passes vacuously. See #65.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Unit tests (no live API calls)
        run: uv run pytest -q -m "not integration and not stress and not sandbox"

  sandbox:
    name: Linux sandbox
    runs-on: ubuntu-latest
    # Real VM tests take about 31 minutes. Give them their own budget instead
    # of sharing 40 minutes with the roughly 9-minute native suite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install microsandbox runtime
        run: uv sync --all-extras
      - name: Check Linux microVM runtime
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          uv run --no-sync msb doctor
      # The executor tests use real microVMs; legacy guard-helper tests remain
      # separate checks of the compatibility utilities. No provider keys are used.
      - name: Sandbox containment tests
        run: >-
          uv run --no-sync pytest -v -m sandbox --maxfail=3
          --durations=20 --junitxml=artifacts/linux-sandbox.xml
      - name: Upload Linux sandbox results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sandbox
          path: artifacts/

  python-313-error-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --all-extras --no-extra sandbox
      # Traceback source markers differ between supported CPython releases.
      # Keep the formatter, delivery strategies, and DTO boundary compatible
      # without duplicating the entire Python 3.12 suite.
      - name: Python 3.13 error-context compatibility
        run: |
          uv run pytest -q \
            tests/test_error_formatting.py \
            tests/test_error_line_numbers.py \
            tests/edge_cases/test_builtin_shadowing.py \
            tests/runtime/sandbox/test_error_serialization.py \
            tests/strategies/test_codeact_pure_python_coverage.py \
            tests/strategies/test_strategies_coverage.py \
            tests/test_event_backend_roundtrip.py

  macos-native:
    name: macOS native Python ${{ matrix.python-version }}
    # Compatibility code is retained, but macOS is outside current support.
    if: github.event_name == 'workflow_dispatch' && inputs.macos_native
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read
    env:
      NOOA_MODEL_METADATA_REFRESH: "False"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync without sandbox
        run: uv sync --all-extras --no-extra sandbox
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Native CodeAct, shell, storage and ACP
        run: |
          uv run --no-sync pytest -q -m "not integration and not stress and not sandbox" \
            tests/strategies \
            tests/runtime/sandbox/test_config.py \
            tests/runtime/sandbox/test_wire.py \
            tests/runtime/sandbox/test_error_serialization.py \
            tests/runtime/test_producers.py \
            tests/tools/test_shell_timeout_contract.py \
            tests/tools/test_shell_lifecycle.py \
            tests/storage/test_sqlite_public_options.py \
            tests/test_secrets.py \
            packages/nooa-acp/tests \
            --junitxml=artifacts/macos-native.xml
      - name: Upload macOS native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-${{ matrix.python-version }}
          path: artifacts/

  macos-sandbox-ipc:
    name: macOS microsandbox and ACP
    # GitHub-hosted macOS cannot expose nested virtualization. Real VM tests
    # run only when explicitly dispatched to a capable self-hosted ARM64 Mac.
    if: github.event_name == 'workflow_dispatch' && inputs.macos_sandbox
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --all-extras
      - name: Check Apple Silicon and microVM runtime
        run: |
          mkdir -p artifacts
          test "$(uname -m)" = arm64
          uv run --no-sync msb doctor 2>&1 | tee artifacts/microsandbox-doctor.log
      # These tests execute Python in Linux guests and check state, file/network
      # permissions, resources, error transport, cancellation and ACP stdio.
      # A runner without usable virtualization fails instead of skipping them.
      - name: Real macOS microVM and ACP tests
        run: |
          uv run --no-sync pytest -q -m sandbox --maxfail=1 \
            tests/runtime/sandbox/test_bootstrap.py \
            tests/runtime/sandbox/test_microsandbox_backend.py \
            tests/runtime/sandbox/test_codeact_sandbox.py \
            tests/runtime/sandbox/test_executor.py::test_declared_data_types_cross_the_boundary_both_ways \
            tests/runtime/sandbox/test_executor.py::test_numpy_values_cross_the_boundary_both_ways \
            packages/nooa-acp/tests/test_protocol.py \
            --junitxml=artifacts/macos-sandbox.xml
      - name: Report remaining sandboxes
        if: always()
        run: |
          mkdir -p artifacts
          uv run --no-sync msb ls 2>&1 | tee artifacts/microsandbox-cleanup.log
      - name: Upload macOS sandbox results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-microsandbox
          path: artifacts/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for uv-dynamic-versioning
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Mirrors the publish workflow's build exactly (--no-sources included) so
      # this job stays a real canary for release-build breakage.
      - name: Build all packages
        run: |
          rm -rf dist
          for pkg in nooa nooa-cli nooa-acp nooa-memory nooa-bench; do
            uv build --no-sources --package "$pkg" --out-dir dist
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Proves the committed viewer bundle is exactly what building the committed
  # source produces. dist/ is 424 KB of minified JS that no reviewer can read,
  # so without this the bundle is an unreviewable trust input that any
  # contributor could poison independently of the TypeScript they submit. With
  # it, dist/ is a derived value CI re-derives from scratch on every PR, and the
  # only way into the viewer is through a reviewable source diff.
  #
  # This job is only meaningful if it cannot be skipped: for `pull_request`,
  # GitHub runs the workflow as written in the PR, so a PR may delete this job.
  # It must be a REQUIRED status check on main — otherwise a PR that removes it
  # merges green. See also CODEOWNERS on package*.json: `npm run build` executes
  # vite.config.ts and every plugin in node_modules, which `--ignore-scripts`
  # does not cover, so a lockfile change is arbitrary code execution here.
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Exact pin: this job's output IS the security property, so the
          # toolchain producing it should not float. Output was verified
          # byte-identical on 20.19.5 and 22.20.0, so a bump is safe.
          # Floor is now react-router 8.3.0's `engines.node: >=22.22.0` — the
          # only release patching GHSA-qwww-vcr4-c8h2 — so this cannot go back
          # below 22.22.0 without reintroducing that advisory.
          node-version: "22.23.2"
      - name: Rebuild the viewer bundle from source
        working-directory: src/nooa/viewer/frontend-react
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          # Build into an EMPTY dist/. Two reasons, both load-bearing:
          #  1. A file that is committed but that the build does not produce
          #     (i.e. smuggled in) then shows up as deleted rather than silently
          #     surviving untouched.
          #  2. The build must not see the artifact it is being checked against.
          #     src/index.css carries `@source not '../dist'` so Tailwind skips
          #     it; wiping dist/ means the check holds even if that regresses.
          rm -rf dist
          npm run build
          # Audit trail: the hashes CI derived, readable in the job log.
          sha256sum dist/index.html dist/assets/*
      - name: Fail if committed dist/ is not exactly what the build produced
        run: |
          set -euo pipefail
          DIST=src/nooa/viewer/frontend-react/dist
          # Guard against a vacuous pass. `git status --porcelain <path>` warns
          # on stderr and prints NOTHING when the path does not resolve, which
          # reads as success — so a wrong path or a relocated dist/ would report
          # a clean build having verified nothing. Same failure mode the
          # gitleaks job guards against below. Assert we are looking at real,
          # tracked files before trusting an empty result.
          test -d "$DIST" \
            || { echo "::error::$DIST does not exist — the build did not produce it"; exit 1; }
          test "$(git ls-files -- "$DIST" | wc -l)" -gt 0 \
            || { echo "::error::no tracked files under $DIST — the check would pass vacuously"; exit 1; }
          # `git status --porcelain`, not `git diff`: git diff only reports
          # tracked-and-modified files, so it passes a PR that ADDS a file to
          # dist/. Porcelain reports ' M' modified, '??' produced-but-uncommitted
          # and ' D'/'AD' committed-but-not-produced — all three are failures.
          CHANGES=$(git status --porcelain -- "$DIST")
          if [ -n "$CHANGES" ]; then
            echo "::error::dist/ does not match a clean rebuild of the committed source."
            echo "$CHANGES"
            echo
            echo "If you changed the viewer UI, rebuild and commit the result:"
            echo "  cd src/nooa/viewer/frontend-react && npm ci --ignore-scripts && rm -rf dist && npm run build"
            exit 1
          fi
          echo "OK — committed dist/ is reproducible from source."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the scan covers all commits
      # Invokes the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # That action is not on this org's GitHub Actions allowlist, and a
      # disallowed action fails the *entire workflow* at startup — which is why
      # every CI run since 2026-07-21 was a 0-second `startup_failure` and no
      # lint, test, or build job ran at all.
      #
      # Pinned to an exact version and checksum-verified: the binary is fetched
      # at runtime, so an unpinned tag would be an unreviewed remote dependency.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # `gitleaks git` exits 0 with "no leaks found" when it has no history
          # to read — a shallow clone scans 1 commit and passes vacuously, and a
          # non-repo scans 0. Fail loudly instead of reporting a clean scan.
          test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" \
            || { echo "::error::not a git checkout — gitleaks would pass vacuously"; exit 1; }
          test "$(git rev-parse --is-shallow-repository)" = "false" \
            || { echo "::error::shallow clone — gitleaks would miss history (need fetch-depth: 0)"; exit 1; }
          # Gitleaks defaults to scanning every fetched ref. With fetch-depth: 0,
          # checkout fetches all remote branches, so a finding on an unrelated
          # branch can fail an otherwise-clean PR. Scan the complete history
          # reachable from the checked-out PR merge commit instead.
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="HEAD" .

  # Verify installed wheels on native Windows, without a platform override or VM.
  windows-core-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Fail instead of skipping when nooa.exe or nooa-cli is missing.
      NOOA_SMOKE_STRICT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for uv-dynamic-versioning
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        run: |
          rm -rf dist
          for pkg in nooa nooa-cli nooa-acp nooa-memory nooa-bench; do
            uv build --no-sources --package "$pkg" --out-dir dist
          done
      - name: Install wheels into a clean environment
        run: |
          uv venv .smoke
          uv pip install --python .smoke/Scripts/python.exe dist/*.whl
      - name: Import every distribution
        run: .smoke/Scripts/python.exe -c "import nooa, nooa_cli, nooa_acp, nooa_memory, nooa_bench; print(nooa.__version__)"
      - name: CLI help
        run: .smoke/Scripts/nooa.exe --help
      - name: Pure-Python core smoke
        run: .smoke/Scripts/python.exe scripts/windows_smoke.py
