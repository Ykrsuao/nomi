[project]
name = "aster-bench"
# Version is derived from git tags at build time by uv-dynamic-versioning.
dynamic = ["version"]
description = "Coding benchmark agents, Harbor runner and trajectory analysis for the ASTER framework"
license = {text = "Apache-2.0"}
readme = "README.md"
# Matches aster and aster-cli (both >=3.12,<3.14), which this depends on.
# Without the upper bound, installing on 3.14 fails with a confusing
# "could not find a version that satisfies aster" instead of a clean
# "requires a different Python".
requires-python = ">=3.12,<3.14"
dependencies = [
    "aster",
    "aster-cli",
    "click>=8.1",
]


[project.scripts]
aster-harbor = "aster_bench.runner:main"

[tool.uv.sources]
aster = { workspace = true }
aster-cli = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.0.6"

[tool.hatch.build.targets.wheel]
packages = ["src/aster_bench"]
